name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The suite is plain ESM on the Node releases this package supports; it
        # needs no build step and sleeps only on process lifecycle tests.
        node: ['22.x', '24.x']
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install desktop development peers
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Inspect installed desktop peer capabilities and capture lock (temporary)
        run: |
          node --input-type=module -e "import Schema from '@deepseek-ai/schemastery'; import * as paths from '@deepseek-ai/dsh-home-paths'; console.log('DESKTOP_PEERS', {volatile: typeof Schema.object({}).volatile, pathExports: Object.keys(paths)});"
          node -e "const fs=require('node:fs'); console.log('CLAUDE_LOCK_BEGIN'); console.log(fs.readFileSync('package-lock.json','utf8')); console.log('CLAUDE_LOCK_END');"
      - name: Test
        run: npm test
      - name: Verify real DSH schemas and generated PTC tool bindings
        run: npm run test:host
      - name: Install and exercise the packed public machine lifecycle
        run: npm run test:package
