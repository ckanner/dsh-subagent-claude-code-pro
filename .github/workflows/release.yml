name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: https://registry.npmjs.org

      - name: Use an npm that knows trusted publishing
        run: |
          npm install --global npm@latest
          node --version
          npm --version

      - name: Install desktop development peers
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Verify real DSH schemas and generated PTC tool bindings
        run: npm run test:host

      - name: Verify the packed public machine API
        run: npm run test:package

      - name: Resolve the version, and refuse a tag that does not match it
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != 'tag' ]; then
            tag="$version"
          fi
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Releasing dsh-subagent-claude-code-pro@$version"

      - name: Ask the registry whether this version exists yet
        id: registry
        run: |
          if npm view "dsh-subagent-claude-code-pro@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish through npm trusted publishing
        if: steps.registry.outputs.published == 'false'
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/trusted-publishing.npmrc
        run: |
          : > "$NPM_CONFIG_USERCONFIG"
          npm publish --access public --provenance

      - name: Record a version that is already on the registry
        if: steps.registry.outputs.published == 'true'
        run: |
          echo "dsh-subagent-claude-code-pro@$VERSION is already on the registry." >> "$GITHUB_STEP_SUMMARY"
          echo "This run records its GitHub Release and publishes nothing." >> "$GITHUB_STEP_SUMMARY"

      - name: Pack the tarball the Release carries
        run: |
          npm pack
          mv dsh-subagent-claude-code-pro-*.tgz dsh-subagent-claude-code-pro.tgz

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" dsh-subagent-claude-code-pro.tgz --clobber
          else
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --generate-notes \
              dsh-subagent-claude-code-pro.tgz
          fi
